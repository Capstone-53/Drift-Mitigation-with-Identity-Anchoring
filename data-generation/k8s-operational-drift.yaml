apiVersion: apps/v1
kind: Deployment
metadata:
  name: operational-drift-agents
  labels:
    app: agent
    type: drift
    drift-category: operational
spec:
  replicas: 2  # 2 operational drift agents
  selector:
    matchLabels:
      app: agent
      type: drift
      drift-category: operational
  template:
    metadata:
      labels:
        app: agent
        type: drift
        drift-category: operational
    spec:
      serviceAccountName: agent-sa
      containers:
      - name: agent
        image: multi-drift-agent:latest
        imagePullPolicy: Never
        env:
        - name: AGENT_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: DRIFT_TYPE
          value: "operational"
        - name: DRIFT_DELAY
          value: "60"
        - name: DURATION
          value: "3600"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: data-volume
          mountPath: /data
      volumes:
      - name: data-volume
        hostPath:
          path: /mnt/agent-data
          type: DirectoryOrCreate
      restartPolicy: Always
