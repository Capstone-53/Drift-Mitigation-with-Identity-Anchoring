apiVersion: v1
kind: ServiceAccount
metadata:
  name: normal-agent-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: normal-agent-role
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "configmaps", "services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: normal-agent-binding
subjects:
  - kind: ServiceAccount
    name: normal-agent-sa
    namespace: default
roleRef:
  kind: ClusterRole
  name: normal-agent-role
  apiGroup: rbac.authorization.k8s.io
